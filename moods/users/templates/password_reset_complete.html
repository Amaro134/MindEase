{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset Complete | MindEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-teal-400 to-green-300 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8 text-center">
    <img src="{% static 'images/mindease-logo.png' %}" alt="MindEase Logo" class="mx-auto w-20 h-20 mb-3">
    <h1 class="text-2xl font-bold text-gray-700 mb-3">Password Reset Successful</h1>
    <p class="text-gray-600 mb-6">
      Your password has been updated successfully. You can now log in using your new password.
    </p>
    <a href="{% url 'login' %}" class="bg-teal-500 text-white py-3 px-6 rounded-lg font-semibold hover:bg-teal-600 transition">
      Go to Login
    </a>
  </div>
</body>
</html>
