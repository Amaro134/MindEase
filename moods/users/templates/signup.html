{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindEase | Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-teal-400 to-green-300 flex items-center justify-center min-h-screen">

  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
    <!-- Logo / Heading -->
    <div class="text-center mb-8">
      <img src="{% static 'images/Pink and Black Elegant Personal Name Initials Logo.png' %}" alt="MindEase Logo" class="mx-auto w-20 h-20 mb-3">
      <h1 class="text-3xl font-bold text-gray-700">Create Your Account</h1>
      <p class="text-gray-500 mt-1">Join MindEase and take care of your wellbeing</p>
    </div>

    <!-- Display error/success messages -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="px-4 py-3 rounded-lg mb-2
                      {% if message.tags == 'error' %}bg-red-100 text-red-700
                      {% elif message.tags == 'success' %}bg-green-100 text-green-700
                      {% else %}bg-gray-100 text-gray-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Signup Form -->
    <form method="POST" class="space-y-6">
      {% csrf_token %}
      <div>
        <label for="fullname" class="block text-gray-600 font-medium mb-2">Full Name</label>
        <input type="text" name="fullname" id="fullname" placeholder="John Doe"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-400" required>
      </div>

      <div>
        <label for="email" class="block text-gray-600 font-medium mb-2">Email</label>
        <input type="email" name="email" id="email" placeholder="you@example.com"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-400" required>
      </div>

      <div>
        <label for="password" class="block text-gray-600 font-medium mb-2">Password</label>
        <input type="password" name="password" id="password" placeholder="********"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-400" required>
      </div>

      <div>
        <label for="confirm_password" class="block text-gray-600 font-medium mb-2">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" placeholder="********"
               class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-400" required>
      </div>

      <button type="submit" 
              class="w-full bg-teal-500 text-white py-3 rounded-lg font-semibold shadow hover:bg-teal-600 transition">
        Sign Up
      </button>
    </form>

    <!-- Divider -->
    <div class="my-6 border-t border-gray-200"></div>

    <!-- Login Redirect -->
    <p class="text-center text-gray-600">
      Already have an account? 
      <a href="{% url 'login' %}" class="text-teal-600 font-semibold hover:underline">Log In</a>
    </p>
  </div>

</body>
</html>
