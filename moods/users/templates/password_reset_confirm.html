{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | MindEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-teal-400 to-green-300 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
    <div class="text-center mb-8">
      <img src="{% static 'images/mindease-logo.png' %}" alt="MindEase Logo" class="mx-auto w-20 h-20 mb-3">
      <h1 class="text-2xl font-bold text-gray-700">Set New Password</h1>
      <p class="text-gray-500 mt-1">Enter your new password below</p>
    </div>

    <!-- Display messages -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="px-4 py-3 rounded-lg mb-2
                      {% if message.tags == 'error' %}bg-red-100 text-red-700
                      {% elif message.tags == 'success' %}bg-green-100 text-green-700
                      {% else %}bg-gray-100 text-gray-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" class="space-y-6">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full bg-teal-500 text-white py-3 rounded-lg font-semibold shadow hover:bg-teal-600 transition">
        Reset Password
      </button>
    </form>
  </div>
</body>
</html>
