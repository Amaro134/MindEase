{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Article | MindEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.6s ease-in-out; }
  </style>
</head>

<body class="bg-gradient-to-br from-teal-100 via-green-100 to-white text-gray-800 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="bg-teal-700 text-white shadow-lg">
    <div class="container mx-auto flex justify-between items-center py-4 px-6">
      <a href="{% url 'index' %}" class="font-bold text-2xl tracking-wide">MindEase</a>
      <ul class="flex space-x-6">
        <li><a href="{% url 'article_list' %}" class="hover:text-teal-200">Articles</a></li>
        <li><a href="{% url 'dashboard' %}" class="hover:text-teal-200">Dashboard</a></li>
      </ul>
    </div>
  </nav>

  <!-- Upload Form -->
  <section class="flex-grow py-20 px-6 flex items-center justify-center">
    <div class="bg-white/90 backdrop-blur-lg shadow-xl rounded-2xl p-10 w-full max-w-2xl fade-in">
      <h2 class="text-3xl font-bold text-center text-teal-700 mb-8">Share Your Mindfulness Article</h2>

      <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Title Field -->
        <div>
          <label class="block font-medium text-gray-700 mb-1">Title</label>
          {{ form.title }}
        </div>

        <!-- Content Field -->
        <div>
          <label class="block font-medium text-gray-700 mb-1">Content</label>
          {{ form.content }}
        </div>

        <!-- Image Field -->
        <div>
          <label class="block font-medium text-gray-700 mb-1">Cover Image (optional)</label>
          {{ form.image }}
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-lg shadow-md transition">
          Publish Article
        </button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-teal-700 text-white py-6 mt-auto">
    <div class="container mx-auto px-4 text-center">
      <p>&copy; {{ year|default:2025 }} MindEase. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
